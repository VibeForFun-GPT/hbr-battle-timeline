name: Feature request
description: 提出具体使用场景和期望行为。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前哪一步不方便？请用脱敏示例说明。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 描述输入、操作和输出，以及能否接受手动核对。
    validations:
      required: true
